<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier — Showroom thời trang 1000 m²</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="stack">
      <section class="panel">
        <p class="eyebrow">Maison</p>
        <h1>Atelier</h1>
        <p class="spec">Showroom 1.000 m² · sàn 40 × 25 m · trần 4,5 m</p>
      </section>
      <section class="panel">
        <p class="eyebrow">Đang đứng tại</p>
        <p id="zone-vi" class="zone-vi">Sảnh vào</p>
        <p id="zone-en" class="zone-en">Entrance</p>
      </section>
    </div>

    <section class="panel help-panel">
      <p>Kéo chuột để xoay · cuộn để zoom</p>
      <p>WASD hoặc phím mũi tên để đi dạo</p>
      <p>Giữ Shift để đi nhanh</p>
    </section>

    <section class="panel legend" aria-label="Sáu khu trưng bày">
      <p class="eyebrow">Mặt bằng</p>
      <ul>
        <li><i class="swatch apparel"></i>Quần áo</li>
        <li><i class="swatch jewelry"></i>Trang sức</li>
        <li><i class="swatch watches"></i>Đồng hồ</li>
        <li><i class="swatch footwear"></i>Giày dép</li>
        <li><i class="swatch handbags"></i>Túi xách</li>
        <li><i class="swatch accessories"></i>Phụ kiện</li>
      </ul>
    </section>

    <script type="module" src="/main.js"></script>
  </body>
</html>
